name: F8D
options:
  bundleIdPrefix: com.f8d
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  F8D:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: 0xF8D
        PRODUCT_MODULE_NAME: F8D
        PRODUCT_BUNDLE_IDENTIFIER: com.f8d.steps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 0xF8D
        CFBundleDevelopmentRegion: ar
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "يقرأ التطبيق خطواتك من الصحة (الجوال والساعة) عشان يحسب خطواتك ودروعك."
    entitlements:
      path: Config/F8D.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
