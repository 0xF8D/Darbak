name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Cloud config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'enum CloudSecrets {\n    static let url = "%s"\n    static let anonKey = "%s"\n}\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > Sources/CloudSecrets.swift
            echo "Cloud: configured"
          else
            echo "Cloud: not configured (groups disabled)"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Darbak.xcodeproj -scheme Darbak -configuration Release             -sdk iphoneos -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             > build.log 2>&1 || { grep -E "error:" build.log | head -80; tail -40 build.log; exit 1; }
          tail -3 build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Darbak.app
          WIDGET="$APP/PlugIns/DarbakWidget.appex"
          ls "$APP" "$WIDGET"
          ldid -SConfig/DarbakWidget.entitlements "$WIDGET/DarbakWidget"
          ldid -SConfig/Darbak.entitlements "$APP/Darbak"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Darbak.ipa Payload
          ls -lh Darbak.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Darbak-ipa
          path: Darbak.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | tr -d '\r' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Version: $VERSION"

          # نسخة مرقمة (v2.1، v2.2 ...) بملاحظات الإصدار
          gh release delete "v$VERSION" --cleanup-tag -y || true
          gh release create "v$VERSION" Darbak.ipa --title "دربك v$VERSION" --notes-file RELEASE_NOTES.md --latest=false

          # «latest»: نفس رابط التحميل الثابت دايمًا
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Darbak.ipa --title "دربك v$VERSION (آخر نسخة)" --notes-file RELEASE_NOTES.md
