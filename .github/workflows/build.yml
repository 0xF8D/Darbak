name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project F8D.xcodeproj -scheme F8D -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          ldid -SConfig/F8D.entitlements "$APP/0xF8D"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr 0xF8D.ipa Payload
          ls -lh 0xF8D.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: 0xF8D-ipa
          path: 0xF8D.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest 0xF8D.ipa --title "0xF8D latest" --notes "Build #${{ github.run_number }}"
